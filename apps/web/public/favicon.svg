<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Whiteboard">
  <!-- Rounded board frame -->
  <rect x="2.5" y="3.5" width="27" height="25" rx="3.5" fill="#ffffff" stroke="#2f6df6" stroke-width="2"/>
  <!-- Marker stroke -->
  <path d="M7 22.5c2.2-.6 3.4-1.7 4.6-3.9 1.1-2 1.9-4.4 2.9-4.4.8 0 1 1.3.3 2.8-.9 1.9-2.6 3.4-4.3 4.3"
        fill="none" stroke="#16181d" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sticky note -->
  <rect x="17.5" y="8" width="8" height="7" rx="1" fill="#ffd666" stroke="#e0a92b" stroke-width="1.2"/>
  <!-- Connector to a small dot node -->
  <path d="M19 15.4c-1 2.2-2.6 3.6-5 4.6" fill="none" stroke="#2f6df6" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2.6 2.4"/>
  <circle cx="12.6" cy="20.6" r="2.1" fill="#2f6df6"/>
</svg>
