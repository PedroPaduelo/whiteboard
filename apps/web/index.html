  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

         are handled by the canvas, not by the browser. -->

    <meta
      name="description"
      content="Collaborative whiteboard: draw, sketch and structure ideas together in real time."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Whiteboard</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This whiteboard needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
