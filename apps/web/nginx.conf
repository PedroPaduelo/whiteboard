# nginx.conf for the whiteboard web app.
# Installed to /etc/nginx/conf.d/default.conf and served by a non-root nginx
# on port 8080 (see the Dockerfile for the matching nginx.conf).
#
# One origin for everything: the SPA at /, and /api (REST and the WebSocket
# at /api/ws) proxied to the API. That is what the bundle expects by default
# (API_URL '/api', see src/api/client.js) and what docker-compose.yml runs, so
# the browser needs no CORS and no build-time URL. Without the proxy, /api
# fell through to the SPA fallback: every API call got index.html with a 200
# (an empty board list), a POST got 405, and the socket never upgraded.

# `Connection: upgrade` only for requests that ask to upgrade (the socket);
# plain requests keep `close` so upstream keep-alive stays nginx's business.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Where /api is proxied to. `api:3001` is the API service of
    # docker-compose.yml. It is a variable on purpose: nginx then resolves the
    # name per request through `resolver` (Docker's embedded DNS) instead of
    # once at startup, so the web container starts even while the API is still
    # down (requests get a JSON 503 until it is up). Outside Docker, point it at
    # your API and use your own resolver (an IP needs none).
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $api_upstream "http://api:3001";

    # Extra origin(s) the page may connect to, for the SPLIT deployment only
    # (bundle built with an absolute VITE_API_URL / VITE_WS_URL on another host;
    # the API then needs CORS_ORIGIN set to this site's origin). Empty for the
    # same-origin setup above, where 'self' already covers /api and /api/ws.
    set $api_origin "";

    # --- security headers -------------------------------------------------
    # The CSP is the header that turns an XSS payload in a board (a malicious
    # board title, an injected label, a crafted export filename) from a real
    # compromise into a blocked script. Keep it tight; widen deliberately.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' $api_origin ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    server_tokens off;

    # --- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;
    # Do not compress sourcemaps or already-compressed binaries.
    gzip_disable "msie6";

    # --- caching ----------------------------------------------------------
    # Hashed build output never changes under the same name.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The entry document names the hashed bundles, so it must never be cached
    # or users keep loading a dead asset manifest after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' $api_origin ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.svg {
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- the API (REST + WebSocket) ----------------------------------------
    # The URI goes upstream unchanged (/api/boards -> http://api:3001/api/boards):
    # the API serves under its own /api prefix.
    # `^~`: no regex location below (e.g. the `.map` rule) may steal an API path.
    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A board socket idles between edits; the client pings well within this.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Op batches carry images as data URLs: match the API's 8 MB body limit.
        client_max_body_size 8m;
        # Answers are live data, never cached by the browser or a proxy.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        # API down or unreachable: a JSON error the client can show, not index.html.
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"statusCode":503,"code":"API_UNAVAILABLE","error":"Service Unavailable","message":"A API não está respondendo. Tente de novo em instantes."}';
    }

    # --- SPA fallback -----------------------------------------------------
    # Any unknown path is a client route, not a 404. Without this, reloading
    # on /b/abc123 gives a hard 404 and the app is unusable.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Source maps are emitted for debugging but should not be served publicly.
    location ~ \.map$ {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /index.html;
}
