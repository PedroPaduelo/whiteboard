# nginx.conf for the whiteboard web app.
# Installed to /etc/nginx/conf.d/default.conf and served by a non-root nginx
# on port 8080 (see the Dockerfile for the matching nginx.conf).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API/WS origin used by the browser bundle. Same-origin '/api' in dev;
    # in production the SPA talks to this absolute origin. Adjust to match your
    # deployment (or drop the origins you do not use).
    set $api_origin "http://localhost:3001";

    # --- security headers -------------------------------------------------
    # The CSP is the header that turns an XSS payload in a board (a malicious
    # board title, an injected label, a crafted export filename) from a real
    # compromise into a blocked script. Keep it tight; widen deliberately.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' $api_origin ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    server_tokens off;

    # --- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;
    # Do not compress sourcemaps or already-compressed binaries.
    gzip_disable "msie6";

    # --- caching ----------------------------------------------------------
    # Hashed build output never changes under the same name.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The entry document names the hashed bundles, so it must never be cached
    # or users keep loading a dead asset manifest after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' $api_origin ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.svg {
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # --- SPA fallback -----------------------------------------------------
    # Any unknown path is a client route, not a 404. Without this, reloading
    # on /board/abc123 gives a hard 404 and the app is unusable.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Source maps are emitted for debugging but should not be served publicly.
    location ~ \.map$ {
        return 404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /index.html;
}
